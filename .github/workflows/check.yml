name: Theme check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the theme
        uses: actions/checkout@v7
        with:
          path: nefantaris-theme-docs

      - name: Check out nefantaris-core
        uses: actions/checkout@v7
        with:
          repository: nefantaris/nefantaris-core
          path: nefantaris-core

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: "npm"
          cache-dependency-path: nefantaris-core/package-lock.json

      - name: Install nefantaris-core
        working-directory: nefantaris-core
        run: npm ci

      - name: Run nef theme check
        working-directory: nefantaris-core
        run: npx tsx src/cli/index.ts theme check ../nefantaris-theme-docs
